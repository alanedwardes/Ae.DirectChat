<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#222">
    <title>Direct Chat - Alan Edwardes</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div id="remoteVideo"></div>
    <video muted playsinline autoplay id="localVideo"></video>
    <div class="messages" aria-live="polite"></div>
    <button id="enableAudioButton" class="hidden">🔊 Tap to enable sound</button>

    <div id="panels">
        <section id="audioControls" class="window hidden" aria-label="Audio">
            <header class="windowHeader">
                <h1>🎤 Audio</h1>
                <button class="closeButton" aria-label="Close">✕</button>
            </header>
            <div class="windowBody">
                <canvas id="volumeHistogramCanvas" width="465" height="64"></canvas>
                <form id="audioParameters"></form>
            </div>
        </section>
        <section id="videoControls" class="window hidden" aria-label="Video">
            <header class="windowHeader">
                <h1>📷 Video</h1>
                <button class="closeButton" aria-label="Close">✕</button>
            </header>
            <div class="windowBody">
                <form id="videoParameters"></form>
            </div>
        </section>
        <section id="screenControls" class="window hidden" aria-label="Screen">
            <header class="windowHeader">
                <h1>🖥️ Screen</h1>
                <button class="closeButton" aria-label="Close">✕</button>
            </header>
            <div class="windowBody">
                <form id="screenParameters"></form>
            </div>
        </section>
        <section id="attendeeWindow" class="window hidden" aria-label="Attendees">
            <header class="windowHeader">
                <h1>🧍 Attendees</h1>
                <button class="closeButton" aria-label="Close">✕</button>
            </header>
            <div class="windowBody">
                <ol id="attendeeList"></ol>
            </div>
        </section>
        <section id="logWindow" class="window hidden" aria-label="Logs">
            <header class="windowHeader">
                <h1>📜 Logs</h1>
                <button class="closeButton" aria-label="Close">✕</button>
            </header>
            <div class="windowBody">
                <ol id="logList"></ol>
            </div>
        </section>
    </div>

    <nav class="controls">
        <button id="audioControlsButton" data-panel="audioControls" title="Audio"><span class="icon">🎤</span><span class="text">Audio</span></button>
        <button id="videoControlsButton" data-panel="videoControls" title="Video"><span class="icon">📷</span><span class="text">Video</span></button>
        <button id="screenControlsButton" data-panel="screenControls" title="Screen"><span class="icon">🖥️</span><span class="text">Screen</span></button>
        <button id="attendeeWindowButton" data-panel="attendeeWindow" title="Attendees"><span class="icon">🧍</span><span class="text">Attendees</span></button>
        <button id="logWindowButton" data-panel="logWindow" title="Logs"><span class="icon">📜</span><span class="text">Logs</span></button>
    </nav>
    <script type="module" src="js/Entry.js"></script>
</body>

</html>
